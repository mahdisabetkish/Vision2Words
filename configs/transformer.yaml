# Phase 2 decoder B: Transformer decoder over the 7x7 spatial feature grid.
data:
  raw_dir: data/raw
  feature_dir: data/features
  min_word_freq: 5

model:
  type: transformer
  feature_size: 1280
  d_model: 512
  num_layers: 4
  num_heads: 8
  ff_size: 2048
  dropout: 0.1
  max_len: 64

train:
  device: cuda
  seed: 1337
  batch_size: 64
  num_workers: 2
  lr: 0.0003
  weight_decay: 0.00001
  grad_clip_norm: 5.0
  lr_patience: 3
  epochs: 60
  early_stopping_patience: 10
  ckpt_dir: checkpoints/transformer
