# Phase 2 decoder A: LSTM with Bahdanau attention over the 7x7 spatial
# feature grid (Show, Attend and Tell).
data:
  raw_dir: data/raw
  feature_dir: data/features
  min_word_freq: 5

model:
  type: lstm_attention
  feature_size: 1280
  embed_size: 256
  hidden_size: 512
  attn_size: 256
  context_size: 256
  dropout: 0.3

train:
  device: cuda
  seed: 1337
  batch_size: 64
  num_workers: 2
  lr: 0.001
  weight_decay: 0.00001
  grad_clip_norm: 5.0
  lr_patience: 3
  epochs: 60
  early_stopping_patience: 10
  ckpt_dir: checkpoints/lstm_attention
