# Phase 1 baseline: plain LSTM decoder over pooled EfficientNet-B0 features,
# no attention. Intentionally the weakest of the three -- it's the point of
# comparison the other two decoders are measured against.
data:
  raw_dir: data/raw
  feature_dir: data/features
  min_word_freq: 5

model:
  type: lstm
  feature_size: 1280
  embed_size: 256
  hidden_size: 512
  num_layers: 1
  dropout: 0.3

train:
  device: cuda
  seed: 1337
  batch_size: 64
  num_workers: 2
  lr: 0.001
  weight_decay: 0.00001
  grad_clip_norm: 5.0
  lr_patience: 3
  epochs: 60
  early_stopping_patience: 10
  ckpt_dir: checkpoints/lstm_baseline
